name: "CI - Test Features"

on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - ".github/workflows/test.yaml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        baseImage:
          - mcr.microsoft.com/devcontainers/base:ubuntu
          - mcr.microsoft.com/devcontainers/base:debian
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      # Runners use plain Docker Engine, not Docker Desktop, so a bind mount
      # of a genuinely missing host path fails container startup outright
      # instead of falling back to an empty directory the way Docker
      # Desktop does on macOS/Windows (see design note 3 on the Feature).
      # Pre-create the 1Password socket's parent path as a plain directory
      # so the container starts, which reproduces the same "no socket"
      # case the Feature has to be a no-op for.
      - name: "Simulate a host with no 1Password socket"
        run: mkdir -p "$HOME/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"

      - name: "Test '1password-commit-signing' against '${{ matrix.baseImage }}'"
        run: devcontainer features test -f 1password-commit-signing -i ${{ matrix.baseImage }} .
