# Prepares the Copilot cloud agent's environment before each run. The job must be named
# copilot-setup-steps: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/coding-agent/customize-the-agent-environment
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # As in test.yaml, so the agent can run scripts/test-features.sh.
      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Install agent skills
        run: ./scripts/install-agent-skills.sh github-copilot

      - name: List installed skills
        run: ls -l ~/.agents/skills
